[project]
name = "question-paper-generator-api"
version = "0.1.0"
description = "API foundation for the AI question variation and paper generator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pillow>=12.3.0",
  "pymupdf>=1.24,<2.0",
  "pypdf>=5.0,<7.0",
  "pytesseract>=0.3.13",
  "python-docx>=1.1.2,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "sympy>=1.13,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false
